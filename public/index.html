<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille — IA & Tech · Politique · Religion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  /* Direction : posé, éditorial, précis — salle de rédaction, papier et encre. Le globe est le moment riche. */
  :root {
    --bg:#f7f4ee; --side:#f1ede4; --card:#fdfbf7; --raised:#efe9df;
    --text:#1f1b16; --text2:#5e554a; --muted:#7b7266;
    --line:rgba(31,27,22,.09); --accent:#c2410c;
    --ok:#16a34a; --bad:#dc2626;
    --c-tech:#2a5bd7; --c-politique:#c2410c; --c-religion:#3f7a4e;
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --sans:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#161513; --side:#12110f; --card:#1c1a18; --raised:#262421;
      --text:#efe9de; --text2:#aaa398; --muted:#8a847a;
      --line:rgba(239,233,222,.08); --accent:#f0814f;
      --ok:#4cc38a; --bad:#e5484d;
      --c-tech:#6c9cff; --c-politique:#f0814f; --c-religion:#6fc08a;
    }
  }
  /* Chaque rubrique a sa couleur : elle teinte les liens, la courbe et les repères de la page */
  body[data-cat=tech] { --accent:var(--c-tech); }
  body[data-cat=politique] { --accent:var(--c-politique); }
  body[data-cat=religion] { --accent:var(--c-religion); }
  * { box-sizing:border-box; }
  html { color-scheme:light dark; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 15px/22px var(--sans); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  svg.i { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .shell { display:grid; grid-template-columns:256px minmax(0,1fr); min-height:100vh; }

  /* Sidebar */
  aside { position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--side); border-right:1px solid var(--line); padding:24px 16px; display:flex; flex-direction:column; }
  .logo { font:500 18px/1 var(--serif); padding:0 8px; display:flex; align-items:center; gap:8px; height:32px; }
  .logo b { width:8px; height:8px; border-radius:50%; background:var(--c-politique); }
  .group-label { font:400 12px/16px var(--sans); color:var(--muted); padding:0 8px; margin:32px 0 8px; }
  .navlist { display:flex; flex-direction:column; gap:2px; }
  .row { display:flex; align-items:center; gap:10px; height:36px; padding:0 8px; border:1px solid transparent; border-radius:8px; background:none; width:100%; text-align:left; color:var(--text2); transition:background-color 150ms var(--ease), color 150ms var(--ease); }
  .row:hover { background:var(--raised); color:var(--text); }
  .row.active { background:var(--raised); color:var(--text); border-color:var(--line); font-weight:500; }
  .row .label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .n { font:400 12px/16px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }
  .row.src { height:32px; font-size:14px; }
  .sd { width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; margin:0 5px; }
  .sd.bad { background:var(--bad); }
  .side-foot { margin-top:auto; padding:32px 8px 0; font-size:12px; line-height:16px; color:var(--muted); }
  body[data-view=globe] .srclist { display:none; }

  /* Main */
  main { padding:32px 40px 80px; max-width:1240px; width:100%; animation:enter 400ms var(--ease) both; }
  @keyframes enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  /* Boutons de rubriques */
  .cats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:32px; }
  .cat { --c:var(--accent); position:relative; display:flex; align-items:center; gap:16px; padding:16px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; transition:background-color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  .cat:hover { background:var(--raised); }
  .cat:active { transform:scale(.98); }
  .cat.active { border-color:var(--c); background:color-mix(in srgb, var(--c) 7%, var(--card)); }
  .cat .tile { flex:none; display:grid; place-items:center; width:48px; height:48px; border-radius:12px; background:color-mix(in srgb, var(--c) 13%, transparent); color:var(--c); transition:background-color 150ms var(--ease), color 150ms var(--ease); }
  .cat .tile svg { width:22px; height:22px; stroke-width:1.6; }
  .cat.active .tile { background:var(--c); color:var(--bg); }
  .cat .txt { min-width:0; }
  .cat .name { display:block; font:500 17px/24px var(--sans); }
  .cat .meta { display:flex; flex-wrap:wrap; gap:0 8px; font:400 12px/16px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }
  .cat .meta .new { color:var(--c); font-weight:500; }
  .cat .meta .new::before { content:''; display:inline-block; width:6px; height:6px; margin-right:6px; border-radius:50%; background:var(--c); vertical-align:1px; }
  .cat[data-k=tech] { --c:var(--c-tech); } .cat[data-k=politique] { --c:var(--c-politique); } .cat[data-k=religion] { --c:var(--c-religion); }
  .desc { margin:8px 0 0; max-width:48ch; color:var(--text2); font-size:15px; line-height:22px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:32px; flex-wrap:wrap; padding-bottom:24px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font:400 40px/1.1 var(--serif); letter-spacing:-.02em; }
  .live { display:flex; align-items:center; gap:8px; margin-top:12px; font:400 12px/16px var(--mono); color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 2.4s ease-in-out infinite; }
  .dot.off { background:var(--bad); animation:none; }
  @keyframes pulse { 50% { opacity:.35; } }
  .globeview { display:none; }
  body[data-view=globe] .globeview { display:block; }
  body[data-view=globe] .feedview { display:none; }

  .pulse { width:288px; }
  .pulse .cap { display:flex; justify-content:space-between; font:400 12px/16px var(--mono); color:var(--muted); margin-top:8px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:48px; }
  .bars i { height:2px; }
  .bars i { flex:1; background:var(--raised); border-radius:2px; min-height:2px; transition:background-color 150ms var(--ease); }
  .bars i:last-child { background:var(--accent); }
  .bars i:hover { background:var(--text2); }

  /* Globe terrestre */
  .stage { position:relative; height:340px; margin:0 0 32px; background:radial-gradient(120% 120% at 50% 40%, #0f1b30 0%, #070c16 100%); border:1px solid var(--line); border-radius:16px; overflow:hidden; color:#e8ecf4; }
  .stage.big { height:calc(100vh - 168px); min-height:520px; margin-top:24px; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  .stage canvas.drag { cursor:grabbing; }
  .legend { position:absolute; left:16px; top:14px; display:flex; flex-wrap:wrap; gap:4px 16px; max-width:calc(100% - 32px); font:400 12px/16px var(--mono); color:rgba(232,236,244,.72); pointer-events:none; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:8px; height:8px; border-radius:50%; }
  .hintline { position:absolute; left:16px; top:56px; font:400 12px/16px var(--mono); color:rgba(232,236,244,.5); pointer-events:none; }
  .pick { position:absolute; right:16px; top:12px; z-index:3; }
  .pick input { width:220px; height:36px; padding:0 12px; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#eef2fa; font:inherit; transition:border-color 150ms var(--ease); }
  .pick input::placeholder { color:rgba(232,236,244,.5); }
  .pick input:focus { outline:none; border-color:#ff7a45; }
  .stage.big .pick { left:16px; right:auto; top:60px; }
  .stage.big .hintline { top:108px; }
  .stage.big .legend { display:none; }
  /* Page Globe : plein écran, fond noir */
  body[data-view=globe] { background:#000; overflow:hidden; }
  body[data-view=globe] aside { display:none; }
  body[data-view=globe] .shell { display:block; }
  body[data-view=globe] main { padding:0; max-width:none; animation:none; }
  body[data-view=globe] .globeview .head { display:none; }
  body[data-view=globe] .stage.big { position:fixed; inset:0; height:100vh; min-height:0; margin:0; border:0; border-radius:0; background:#000; z-index:10; }
  .back { position:absolute; left:16px; top:12px; z-index:5; display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px 0 10px; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#eef2fa; transition:background-color 150ms var(--ease); }
  .back:hover { background:rgba(255,255,255,.15); }
  .zoomctl { position:absolute; left:16px; bottom:64px; z-index:3; display:flex; flex-direction:column; gap:8px; }
  .zbtn { width:40px; height:40px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#eef2fa; transition:background-color 150ms var(--ease), transform 150ms var(--ease); }
  .zbtn:hover { background:rgba(255,255,255,.15); }
  .zbtn:active { transform:scale(.97); }
  .zbtn svg { width:18px; height:18px; }
  .zlevel { font:400 12px/16px var(--mono); }
  .back svg { transform:rotate(180deg); }
  .stage.has-panel .pick { display:none; }
  .gtip { position:absolute; z-index:2; padding:6px 10px; background:rgba(8,14,26,.94); border:1px solid rgba(255,255,255,.14); border-radius:8px; font:500 13px/20px var(--sans); pointer-events:none; opacity:0; transition:opacity 120ms var(--ease); white-space:nowrap; }
  .gtip.show { opacity:1; }
  .gtip small { font:400 12px/16px var(--mono); color:rgba(232,236,244,.6); margin-left:8px; }
  .chips { position:absolute; left:12px; right:12px; bottom:12px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; z-index:1; }
  .chips::-webkit-scrollbar { display:none; }
  .stage.has-panel .chips { right:404px; }
  .chip { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 8px; border-radius:8px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08); color:#eef2fa; white-space:nowrap; font-size:13px; transition:background-color 150ms var(--ease), border-color 150ms var(--ease); }
  .chip:hover { background:rgba(255,255,255,.16); }
  .chip.on { border-color:#ff7a45; background:rgba(255,122,69,.18); }
  .chip img { width:18px; height:13px; object-fit:cover; border-radius:2px; }
  .chip .n { font:400 12px/16px var(--mono); color:#ff9a6c; }
  .chips .lbl { align-self:center; font:400 12px/16px var(--mono); color:rgba(232,236,244,.55); white-space:nowrap; padding-right:4px; }
  .gmsg { position:absolute; inset:0; display:grid; place-items:center; color:rgba(232,236,244,.6); font:400 13px/20px var(--mono); pointer-events:none; }

  .panel { position:absolute; z-index:4; top:12px; bottom:12px; right:12px; width:380px; display:flex; flex-direction:column; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; overflow:hidden; padding:20px 20px 0; opacity:0; transform:translateX(16px); pointer-events:none; transition:opacity 300ms var(--ease), transform 300ms var(--ease); }
  .stage.has-panel .panel { opacity:1; transform:none; pointer-events:auto; }
  .panel .x { position:absolute; right:12px; top:12px; width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:8px; background:none; color:var(--muted); }
  .panel .x:hover { background:var(--raised); color:var(--text); }
  .panel .flag { width:48px; height:34px; object-fit:cover; border-radius:4px; border:1px solid var(--line); }
  .panel h2 { margin:12px 0 0; font:400 28px/1.15 var(--serif); letter-spacing:-.015em; padding-right:32px; }
  .panel .off { margin:4px 0 0; font-size:13px; line-height:20px; color:var(--muted); }
  .panel dl { margin:20px 0 0; display:grid; grid-template-columns:auto 1fr; gap:8px 16px; }
  .panel dt { font:400 12px/20px var(--mono); color:var(--muted); }
  .panel dd { margin:0; font-size:14px; line-height:20px; }
  .panel h3 { margin:24px 0 4px; font:500 13px/20px var(--sans); color:var(--text2); }
  .panel .news a { display:block; padding:12px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit; }
  .panel .news a:hover b { color:var(--accent); }
  .panel .news small { display:block; font:400 12px/16px var(--mono); color:var(--muted); margin-bottom:4px; }
  .panel .news b { font:500 14px/20px var(--sans); transition:color 150ms var(--ease); }
  .panel .none { font-size:14px; color:var(--muted); padding:8px 0; }
  .phead { display:flex; align-items:center; gap:16px; padding-right:32px; }
  .phead h2 { margin:0; font:400 28px/1.15 var(--serif); letter-spacing:-.015em; padding:0; }
  .phead .off { margin:2px 0 0; font-size:13px; line-height:20px; color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stats > div { padding:10px 12px; background:var(--raised); border-radius:10px; }
  .stats small { display:block; font:400 12px/16px var(--mono); color:var(--muted); }
  .stats b { font:500 18px/24px var(--sans); font-variant-numeric:tabular-nums; }
  .ptabs { display:flex; gap:4px; margin:16px -20px 0; padding:0 20px; border-bottom:1px solid var(--line); flex:none; }
  .ptab { height:40px; padding:0 12px; border:0; border-bottom:2px solid transparent; background:none; color:var(--muted); font-weight:500; font-size:14px; transition:color 150ms var(--ease), border-color 150ms var(--ease); }
  .ptab:hover { color:var(--text); }
  .ptab.on { color:var(--text); border-bottom-color:var(--accent); }
  .pbody { flex:1; overflow-y:auto; margin:0 -20px; padding:0 20px 20px; }
  .pbody h3 { margin:20px 0 4px; font:500 12px/16px var(--mono); color:var(--muted); }
  .nitem { display:block; padding:14px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit; }
  .nitem:hover b { color:var(--accent); }
  .nitem small { display:block; font:400 12px/16px var(--mono); color:var(--muted); margin-bottom:4px; }
  .nitem b { font:400 17px/24px var(--serif); transition:color 150ms var(--ease); }
  .pbody .note { padding:12px 0 0; font-size:12px; line-height:16px; color:var(--muted); }
  .panel .wiki { display:inline-flex; align-items:center; gap:4px; margin-top:16px; color:var(--accent); font-weight:500; font-size:14px; text-decoration:none; }

  .tools { position:sticky; top:0; z-index:6; display:flex; gap:8px; padding:16px 0; background:var(--bg); }
  .tools::after { content:''; position:absolute; left:0; right:0; bottom:-16px; height:16px; background:linear-gradient(var(--bg), transparent); pointer-events:none; }
  .search { position:relative; flex:1; }
  .search svg { position:absolute; left:12px; top:12px; color:var(--muted); }
  .search input { width:100%; height:40px; padding:0 44px 0 36px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; transition:border-color 150ms var(--ease); }
  .search input::placeholder { color:var(--muted); }
  .search input:focus { outline:none; border-color:var(--accent); }
  kbd { position:absolute; right:10px; top:9px; font:400 12px/20px var(--mono); color:var(--muted); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 6px; background:var(--raised); }
  .clear { height:40px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--raised); display:none; transition:background-color 150ms var(--ease); }
  .clear.show { display:block; }

  /* À la une */
  .lead { display:block; text-decoration:none; color:inherit; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:16px; margin:8px 0 24px; transition:border-color 150ms var(--ease); }
  .lead:hover { border-color:var(--accent); }
  .lead .kicker { display:flex; gap:12px; align-items:center; font:400 12px/16px var(--mono); color:var(--muted); margin-bottom:16px; }
  .lead .kicker .tag { color:var(--accent); }
  .lead h2 { margin:0; font:400 32px/1.2 var(--serif); letter-spacing:-.015em; max-width:34ch; text-wrap:balance; }
  .lead p { margin:16px 0 0; color:var(--text2); font-size:16px; line-height:24px; max-width:64ch; }
  .lead .go { display:inline-flex; align-items:center; gap:4px; margin-top:20px; font-weight:500; color:var(--accent); }

  /* Fil */
  .feed { display:flex; flex-direction:column; }
  .item { display:grid; grid-template-columns:104px minmax(0,1fr); gap:16px; padding:20px 16px; margin:0 -16px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; transition:background-color 150ms var(--ease); }
  .item:hover { background:var(--card); }
  .item .when { font:400 12px/20px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px; }
  .item .when .fresh-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:8px; vertical-align:1px; }
  .item .src-name { display:block; font:500 13px/20px var(--sans); color:var(--text2); margin-bottom:4px; }
  .item h3 { margin:0; font:500 17px/24px var(--sans); transition:color 150ms var(--ease); }
  .item:hover h3 { color:var(--accent); }
  .item p { margin:4px 0 0; color:var(--text2); font-size:14px; line-height:20px; max-width:72ch; }
  .empty { padding:64px 0; color:var(--muted); text-align:center; }
  .more { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; height:44px; margin-top:24px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font-weight:500; transition:background-color 150ms var(--ease); }
  .more:hover { background:var(--raised); }
  .more span { font:400 12px/16px var(--mono); color:var(--muted); }
  .count { font:400 12px/16px var(--mono); color:var(--muted); margin:0 0 4px; }
  /* Chargement : emplacements statiques de la taille des vrais articles */
  .skel { display:grid; grid-template-columns:104px minmax(0,1fr); gap:16px; padding:20px 0; border-bottom:1px solid var(--line); }
  .skel i { display:block; height:12px; border-radius:4px; background:var(--raised); }
  .skel i + i { margin-top:12px; }
  .skel .t { height:16px; width:78%; }
  .skel .s { width:92%; }

  @media (max-width: 880px) {
    .shell { grid-template-columns:1fr; }
    aside { position:static; height:auto; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:8px; padding:12px 16px; overflow:visible; border-right:0; border-bottom:1px solid var(--line); }
    aside .group-label, aside .side-foot { display:none; }
    .logo { padding:0 4px; }
    .cats { gap:8px; margin-bottom:24px; }
    .cat { flex-direction:column; align-items:flex-start; gap:12px; padding:12px; border-radius:14px; }
    .cat .tile { width:40px; height:40px; border-radius:10px; }
    .cat .name { font-size:15px; line-height:20px; }
    .desc { display:none; }
    .zoomctl { left:auto; right:16px; }
    .hintline { max-width:calc(100% - 32px); }
    .cat .meta .u { display:none; }
    .navlist { flex-direction:row; overflow-x:auto; scrollbar-width:none; }
    .navlist::-webkit-scrollbar { display:none; }
    #sources { grid-column:1 / -1; }
    .row { width:auto; white-space:nowrap; flex:none; }
    .row.src { border-color:var(--line); padding:0 12px; }
    main { padding:20px 16px 64px; }
    h1 { font-size:32px; }
    .head { padding-bottom:16px; gap:16px; }
    .pulse { width:100%; }
    .bars { height:32px; }
    .item { margin:0 -8px; padding:16px 8px; }
    .stage { height:300px; margin-bottom:24px; }
    .stage.big { height:calc(100vh - 200px); }
    .panel { top:auto; left:8px; right:8px; bottom:8px; width:auto; max-height:62%; }
    .stage.has-panel .chips { right:12px; display:none; }
    .lead { padding:20px; } .lead h2 { font-size:26px; }
    .item { grid-template-columns:1fr; gap:4px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body data-view="feed" data-cat="tech">
<div class="shell">
  <aside>
    <div class="logo"><b></b>Veille</div>
    <div class="group-label">Explorer</div>

const SAND = new Set('EG LY DZ SA NE ML MR TD SD NA AU IQ OM YE AE QA KW MA TN SO TM AF IR BW JO SY'.split(' '));

function toVec(lon, lat) { const l = lon * Math.PI / 180, p = lat * Math.PI / 180, c = Math.cos(p); return [c * Math.sin(l), Math.sin(p), c * Math.cos(l)]; }

    const a2 = info?.a2; let rh;

      id: geom.id, info, name: info?.fr || geom.properties.name, rings, hit, lon: lo, lat: la, vec: toVec(lo, la),

function countriesIn(item) {

function pointIn(lon, lat, ring) {

}

      const p = fetch(`/api/country-news?code=${info.a2}&q=${encodeURIComponent(c.name)}&langs=${info.languages.join(',')}`).then((r) => r.ok ? r.json() : null).catch(() => null);

    if (opts.big) { // liens = pays cités dans un même article
      const pc = new Map();
      for (const it of items) { const cs = countriesIn(it); if (cs.length < 2 || cs.length > 8) continue; for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) { const k = cs[i].id + '-' + cs[j].id; const e = pc.get(k) || { a: cs[i], b: cs[j], n: 0 }; e.n++; pc.set(k, e); } }
      S.links = [...pc.values()].sort((x, y) => y.n - x.n).slice(0, 40).map((l) => ({ ...l, pts: arcPts(l.a.vec, l.b.vec, 28) }));
    }
    drawChips(); if (S.sel) showPanel(S.sel, true);
  }
  function setWorld() { msg.remove(); refresh(); if (pickInput) { let dl = $('countrylist'); if (!dl) { dl = document.createElement('datalist'); dl.id = 'countrylist'; document.body.append(dl); } dl.textContent = ''; [...WORLD.list].sort((a, b) => a.name.localeCompare(b.name, 'fr')).forEach((c) => { const o = document.createElement('option'); o.value = c.name; dl.append(o); }); } }

  const api = { mount, tick, zoomBy: (f) => zoomTo(S.zoomT * f), zoomReset: () => zoomTo(1), refresh, setWorld, closePanel: close, fail: () => { msg.textContent = 'Carte indisponible, nouvelle tentative'; }, visible: () => mount.getClientRects().length > 0, resetKey: () => { S.mkey = ''; } };
  globes.push(api); return api;
}

function loop(t) {
  for (const g of globes) if (g.visible()) { try { g.tick(t); } catch (e) { console.error(e); } }
  requestAnimationFrame(loop);
}

let prevView = 'tech';
const leaveGlobe = () => { view = prevView; render(); window.scrollTo({ top:0 }); };
const bigGlobe = createGlobe($('bigstage'), { big:true, onBack: () => leaveGlobe(), items: () => Object.values(data.items).flat() });
requestAnimationFrame(loop);

async function loadWorld() {
  try {
    const r = await fetch('/api/geo?v=2'); const g = await r.json(); if (g.error) throw new Error(g.error);
    WORLD = buildWorld(g); $('gsub').textContent = `${WORLD.list.length} pays · rotation continue`;
    globes.forEach((x) => { x.setWorld(); });
  } catch { globes.forEach((x) => x.fail()); setTimeout(loadWorld, 15000); }
}
loadWorld();

// =====================================================================
//  Fil d'actualité
// =====================================================================
async function load() {
  try {
    const d = await (await fetch('/api/news')).json();
    const all = Object.values(d.items).flat();
    if (seen.size) freshIds = new Set(all.filter(i => !seen.has(i.id)).map(i => i.id));
    data = d;
    all.forEach(i => { seen.add(i.id); SRC_CAT[i.source] = i.category; });
    localStorage.setItem('seen', JSON.stringify([...seen].slice(-3000)));
    render();
  } catch { setLive(false); }
}

function setLive(ok) {
  $('dot').classList.toggle('off', !ok);
  $('status').textContent = !ok ? 'Hors ligne, reconnexion'
    : data.updatedAt ? `En direct · mis à jour à ${new Date(data.updatedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`
    : 'Première collecte en cours';
}

function render() {
  setLive(true);
  document.body.dataset.view = view === 'globe' ? 'globe' : 'feed';
  document.body.dataset.cat = view;

  const goTo = (k) => { view = k; srcFilter = ''; render(); window.scrollTo({ top:0 }); };
  const cats = $('cats'); cats.textContent = '';
  for (const [k, label] of Object.entries(CATS)) {
    const list = data.items[k] || [], fresh = list.filter((i) => freshIds.has(i.id)).length;
    const b = el('button', 'cat' + (k === view ? ' active' : '')); b.dataset.k = k;
    b.title = `${label} (touche ${Object.keys(CATS).indexOf(k) + 1})`;
    if (k === view) b.setAttribute('aria-current', 'page');
    const tile = el('span', 'tile'); tile.append(icon(k));
    const txt = el('span', 'txt'); const meta = el('span', 'meta');
    const nb = el('span', null, String(list.length)); nb.append(el('span', 'u', ' articles')); meta.append(nb);
    if (fresh) meta.append(el('span', 'new', `${fresh} nouveau${fresh > 1 ? 'x' : ''}`));
    txt.append(el('span', 'name', label), meta);
    b.append(tile, txt);
    b.onclick = () => goTo(k);
    cats.append(b);
  }

  const tabs = $('tabs'); tabs.textContent = '';
  const gb = el('button', 'row' + (view === 'globe' ? ' active' : ''));
  gb.append(icon('globe'), el('span', 'label', 'Globe 3D'));
  gb.onclick = () => { if (view !== 'globe') prevView = view; view = 'globe'; render(); window.scrollTo({ top:0 }); };
  tabs.append(gb);

  if (view === 'globe') { bigGlobe.refresh(); return; }
  const cat = view, items = data.items[cat] || [];
  $('title').textContent = CATS[cat];
  $('desc').textContent = DESC[cat];

  const counts = {};
  items.forEach(i => counts[i.source] = (counts[i.source] || 0) + 1);
  const names = Object.keys(data.status).filter(n => SRC_CAT[n] === cat || counts[n]);
  const sl = $('sources'); sl.textContent = '';
  names.forEach(n => {
    const st = data.status[n] || {};
    const b = el('button', 'row src' + (srcFilter === n ? ' active' : ''));
    b.setAttribute('aria-pressed', srcFilter === n ? 'true' : 'false');
    const d = el('span', 'sd' + (st.ok === false ? ' bad' : ''));
    if (st.ok === false) d.title = 'Source indisponible';
    b.append(d, el('span', 'label', n), el('span', 'n', counts[n] || 0));
    b.onclick = () => { srcFilter = srcFilter === n ? '' : n; render(); };
    sl.append(b);
  });
  $('clear').classList.toggle('show', !!srcFilter);

  const buckets = new Array(24).fill(0);
  items.forEach(i => { const h = Math.floor((Date.now() - i.time) / 3600e3); if (h >= 0 && h < 24) buckets[23 - h]++; });
  const max = Math.max(1, ...buckets);
  const bars = $('bars'); bars.textContent = '';
  buckets.forEach((v) => {
    const i = document.createElement('i');
    i.style.height = Math.max(4, Math.round(v / max * 100)) + '%';
    i.title = `${v} article${v > 1 ? 's' : ''}`;
    bars.append(i);
  });
  $('pulsecap').textContent = `${buckets.reduce((a, b) => a + b, 0)} en 24 h`;

  const q = $('q').value.trim().toLowerCase();
  const filtered = items.filter(i =>
    (!srcFilter || i.source === srcFilter) &&
    (!q || (i.title + ' ' + i.summary).toLowerCase().includes(q)));

  const lead = $('lead'); lead.textContent = '';
  const list = $('list'); list.textContent = '';
  const count = $('count'); count.textContent = '';
  if (!data.updatedAt) {
    for (let n = 0; n < 6; n++) {
      const s = el('div', 'skel'); const l = el('i'); const b = el('div');
      b.append(el('i'), el('i', 't'), el('i', 's'));
      s.append(l, b); list.append(s);
    }
    list.setAttribute('aria-busy', 'true');
    return;
  }
  list.removeAttribute('aria-busy');
  if (!filtered.length) { list.append(el('div', 'empty', q ? `Aucun résultat pour « ${$('q').value.trim()} »` : 'Aucun article')); return; }

  const key = view + '|' + srcFilter + '|' + q;
  if (key !== listKey) { listKey = key; shown = PAGE; }
  const filtering = !!(q || srcFilter);
  if (filtering) count.textContent = `${filtered.length} article${filtered.length > 1 ? 's' : ''}`;

  const [top, ...restAll] = filtered;
  const rest = restAll.slice(0, shown - 1);
  const a = el('a', 'lead'); a.href = top.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
  const k = el('div', 'kicker');
  k.append(el('span', 'tag', filtering ? 'Le plus récent' : 'À la une'), el('span', null, top.source), el('span', null, ago(top.time)));
  a.append(k, el('h2', null, top.title));
  if (top.summary) a.append(el('p', null, top.summary));
  const go = el('span', 'go', "Lire l'article"); go.append(icon('go')); a.append(go);
  lead.append(a);

  for (const i of rest) {
    const row = el('a', 'item'); row.href = i.link; row.target = '_blank'; row.rel = 'noopener noreferrer';
    const w = el('div', 'when');
    if (freshIds.has(i.id)) { const fd = el('span', 'fresh-dot'); fd.title = 'Nouveau'; w.append(fd); }
    w.append(ago(i.time)); w.title = new Date(i.time).toLocaleString('fr-FR');
    const body = el('div');
    body.append(el('span', 'src-name', i.source), el('h3', null, i.title));
    if (i.summary) body.append(el('p', null, i.summary));
    row.append(w, body);
    list.append(row);
  }
  const left = restAll.length - rest.length;
  if (left > 0) {
    const more = el('button', 'more', 'Afficher plus');
    more.append(el('span', null, `${left} restant${left > 1 ? 's' : ''}`));
    more.onclick = () => { shown += PAGE; render(); };
    list.append(more);
  }
}

$('q').oninput = render;
$('clear').onclick = () => { srcFilter = ''; render(); };
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); if (view !== 'globe') $('q').focus(); }
  if (view === 'globe' && document.activeElement.tagName !== 'INPUT') {
    if (e.key === '+' || e.key === '=') bigGlobe.zoomBy(1.3);
    else if (e.key === '-' || e.key === '_') bigGlobe.zoomBy(1 / 1.3);
    else if (e.key === '0') bigGlobe.zoomReset();
  }
  const num = Object.keys(CATS)[+e.key - 1];
  if (num && document.activeElement.tagName !== 'INPUT' && !e.metaKey && !e.ctrlKey && !e.altKey) { view = num; srcFilter = ''; render(); window.scrollTo({ top:0 }); }
  if (e.key === 'Escape') {
    document.activeElement.blur();
    if (view === 'globe') { if ($('bigstage').classList.contains('has-panel')) bigGlobe.closePanel(); else leaveGlobe(); }
  }
});

// Temps réel : flux serveur en local ; en ligne (Vercel, sans connexion longue) on relit toutes les 2 minutes.
if (['localhost', '127.0.0.1'].includes(location.hostname)) {
  const es = new EventSource('/api/stream');
  es.addEventListener('update', load);
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
}

load();
setInterval(() => { if (view !== 'globe') render(); }, 60000);
setInterval(load, 120000);
</script>
</body>
</html>
